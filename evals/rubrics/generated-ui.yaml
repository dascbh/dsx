# Rubric: agent-generated screen inside the design system.
# Gates are binary and fail the version. Criteria use a 0–3 scale with anchors.
# Evaluators: code (DSX tools / axe), judge (eval-judge agent), human.
id: generated-ui
version: 1
attempts-per-case: 3
approval: "all gates on all attempts AND each criterion's average >= threshold"

gates:
  - id: no-raw-values
    evaluator: code
    how: "node tools/lint-raw-values.mjs <generated files>  → 0 occurrences"
  - id: contrast
    evaluator: code
    how: "every text/background pair >= 4.5:1 and non-text UI >= 3:1 (tools/contrast.mjs or axe color-contrast)"
  - id: accessible-names
    evaluator: code
    how: "axe: button-name, link-name, label, image-alt with no violations"
  - id: visible-focus
    evaluator: human
    how: "Tab through every interactive element; focus visible on all of them, none hidden"
  - id: required-states
    evaluator: judge
    how: "the screen implements loading, empty and error for every region that receives data"
  - id: no-dark-patterns
    evaluator: judge
    how: "no item from knowledge/foundations/dark-patterns.md (red lines)"

criteria:
  - id: component-reuse
    evaluator: judge
    threshold: 2
    anchors:
      0: "Recreates components that exist in the kit; local styles everywhere."
      1: "Uses the kit in part; 2+ new components or variants without justification."
      2: "Uses the kit; at most 1 new component, with justification."
      3: "Only kit components; composition identical to equivalent screens in the product."
  - id: visual-hierarchy
    evaluator: judge
    threshold: 2
    anchors:
      0: "No focal point; several elements compete; more than one primary action per region."
      1: "A focal point exists but competes with decoration/color; headings skip levels."
      2: "One h1, one primary action per region, clear grouping by proximity."
      3: "The squint test reveals exactly the intended reading order."
  - id: interaction-patterns
    evaluator: judge
    threshold: 2
    anchors:
      0: "Decisions contradict patterns with status 'avoid' (e.g. modal for a long form, error in a toast)."
      1: "One decision diverges from a recommended pattern without justification."
      2: "Decisions follow the catalog; divergences justified."
      3: "Follows the catalog and covers the checklist items of every pattern used."
  - id: text
    evaluator: judge
    threshold: 2
    anchors:
      0: "Generic buttons ('OK', 'Submit'), errors without a fix, technical jargon."
      1: "Mostly clear, but terms inconsistent with the product or spelling/grammar errors in the product language."
      2: "Verb + object on buttons; errors say what to do; glossary terms."
      3: "Also, the tone adapts to the moment (error, success, empty) and there are no extra words."
  - id: responsiveness
    evaluator: human
    threshold: 2
    anchors:
      0: "Breaks at 320px or requires horizontal scrolling."
      1: "Works at 320px with overlap or small targets."
      2: "Single column at 320px, targets >= 44px, nothing cut off."
      3: "Also, content order prioritized for mobile and 200% zoom without loss."

goals:
  - "new components per screen (lower is better)"
  - "time to first approved version"
guardrails:
  - "no previously passing gate may start failing"
