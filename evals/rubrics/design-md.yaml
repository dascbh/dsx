# Rubric: quality of a DESIGN.md (mirrors skills/design-md, Mode C).
id: design-md
version: 1
max-score: 100
bands:
  robust: [90, 100]
  usable-with-gaps: [75, 89]
  review-before-use: [60, 74]
  high-risk: [0, 59]

gates:
  - id: lint
    evaluator: code
    how: "node tools/lint-design-md.mjs DESIGN.md → 0 errors"
  - id: fidelity
    evaluator: human
    how: "a sample of 5 screens/files does not contradict the file's tokens and components"
  - id: essential-contrast
    evaluator: code
    how: "on-* and text-* pairs over canvas/surface within the minimum (already covered by the lint)"
  - id: connected-to-agent
    evaluator: code
    how: "CLAUDE.md, AGENTS.md or a tool rule references DESIGN.md"
  - id: no-conflict
    evaluator: judge
    how: "no tool rule (.cursor/rules, copilot-instructions) contradicts the DESIGN.md"

criteria:
  - { id: source-fidelity,     weight: 15, evaluator: human }
  - { id: technical-validity,       weight: 10, evaluator: code }
  - { id: semantic-tokens,      weight: 10, evaluator: judge }
  - { id: intent-and-prose,       weight: 15, evaluator: judge }
  - { id: components-and-states,  weight: 15, evaluator: judge }
  - { id: accessibility,         weight: 15, evaluator: judge }
  - { id: responsiveness,         weight: 8,  evaluator: judge }
  - { id: guardrails,             weight: 5,  evaluator: judge }
  - { id: agent-operation,    weight: 4,  evaluator: code }
  - { id: maintenance,             weight: 3,  evaluator: code }

generic-anchors:
  # Apply to each criterion and multiply by the weight fraction.
  0.0: "Missing or contradictory."
  0.33: "Present but generic: the agent would still have to guess core decisions."
  0.67: "Specific for the most part; isolated gaps."
  1.0: "Specific, verifiable and with examples; controlled generation reveals no inventions on this criterion."

acceptance-test:
  description: "Controlled generation: ask for a new screen using only the DESIGN.md and the code; every invented value/state/component is a gap."
  attempts: 3
