# Rubric: quality of a UX.md (mirrors skills/ux-md, Mode C, and evals/rubrics/design-md.yaml).
# The 100-point score is computed by code (node tools/lint-ux-md.mjs UX.md --score [--map …] [--screens …]).
# What the machine cannot measure goes in as judgment gates (human/judge) and as open criteria for the eval-judge,
# which add no points: they fail the file or record gaps.
id: ux-md
version: 1
max-score: 100
bands:
  robust: [90, 100]
  usable-with-gaps: [75, 89]
  review-before-use: [60, 74]
  high-risk: [0, 59]

gates:
  - id: lint
    evaluator: code
    how: "node tools/lint-ux-md.mjs UX.md → 0 errors"
  - id: essential-coverage
    evaluator: code
    how: "every screen in the flow map and in the captures has an archetype in the front matter or sits in a declared deviation (--score with --map/--screens; drift U1)"
  - id: policy-fidelity
    evaluator: code+human
    how: "no front-matter policy contradicted by most screens of an archetype (drift U3, with T1, T2, T5 and L1); a sample of 5 screens confirms the rest"
  - id: connected-to-agent
    evaluator: code
    how: "CLAUDE.md, AGENTS.md or the project's tool rule cites UX.md"
  - id: no-conflict
    evaluator: judge
    how: "no tool rule, DESIGN.md or product document contradicts the UX.md for the same context"

criteria:
  - id: screen-coverage
    weight: 20
    evaluator: code
    how: "inventory screens (map + captures) with an archetype or deviation ÷ total, × fraction of archetypes entries that name a map screen; without an inventory, at most 50%"
  - id: policies-with-evidence
    weight: 15
    evaluator: code
    how: "half: declared policies out of the 15 keys (navigation, actions, confirmation, feedback, forms); half: evidence in the body (file:line + cited pattern ids), full at 15"
  - id: declared-states
    weight: 10
    evaluator: code
    how: "half: the 5 base states in states; half: the 5 described in the Feedback & States section"
  - id: flow-limits
    weight: 10
    evaluator: code
    how: "0.4 limits in flows (3 keys) + 0.3 journeys in the Flows section (≥ 2) + 0.3 limits cited and justified in the text"
  - id: glossary
    weight: 10
    evaluator: code
    how: "per source (single or per module, averaged): 0.3 declared + 0.3 resolves (file exists, inline table or map) + 0.4 terms with 'never call it' (full at 8)"
  - id: dos-donts
    weight: 10
    evaluator: code
    how: "0.4 if Do and Don't each have ≥ 3 items + 0.6 × fraction of items with a concrete anchor (screen, file, number, quoted label, code)"
  - id: verification-selectors
    weight: 10
    evaluator: code
    how: "0.8 × basic selectors (regions, dialog, primary, destructive, button, field) + 0.2 with dialog-footer or archetype-regions"
  - id: freshness
    weight: 10
    evaluator: code
    how: "0.3 version in semver + 0.2 updated YYYY-MM-DD + 0.5 age (≤ 90 days full, 0 at 365); age drops to zero if the screens changed after updated (drift U5)"
  - id: declared-deviations
    weight: 5
    evaluator: code
    how: "deviations in the body table (D1…) and in the front matter's deviations block match (intersection ÷ union); with no deviation at all, full"

# Open criteria: the eval-judge evaluates one at a time, with the UX.md and the captures, and returns evidence + anchor.
# They add no points to the code score; an anchor ≤ 0.33 on any of them is a gap to fix before the file becomes authoritative.
judge-criteria:
  - id: archetype-fit
    question: "Does the assigned archetype match each screen's task (the card's when-to-use and avoid-when), not just its look?"
  - id: policies-are-real
    question: "Do the front-matter policies describe what the product does today (or is the contradiction recorded as a deviation or a Don't), rather than aspiration?"
  - id: dos-donts-from-real-problems
    question: "Does every Do's and Don'ts item come from a real problem (screen, finding, ticket) and state the observable criterion?"
  - id: agent-instructions-actionable
    question: "Do the Agent Instructions say when to consult, what to preserve and how to validate (commands), well enough that a new agent follows them without asking?"
  - id: deviations-justified
    question: "Does every declared deviation have an explicit product reason and cost, rather than being disguised debt (which should be a Don't with a deadline)?"

generic-anchors:
  0.0: "Missing or contradictory."
  0.33: "Present but generic: the agent would still have to guess where each thing goes or how the screen behaves."
  0.67: "Specific for the most part; isolated gaps."
  1.0: "Specific, verifiable and with evidence; controlled generation reveals no invented behavior on this criterion."

acceptance-test:
  description: "Controlled generation: ask for a new screen of an archetype already in use, with only the UX.md, the DESIGN.md and the code; every invented action position, confirmation, state or label is a gap in the UX.md."
  attempts: 3
