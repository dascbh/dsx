# Rubrica: qualidade de um DESIGN.md (espelha skills/design-md, Modo C).
id: design-md
versao: 1
nota_maxima: 100
faixas:
  robusto: [90, 100]
  utilizavel-com-lacunas: [75, 89]
  revisar-antes-de-usar: [60, 74]
  alto-risco: [0, 59]

gates:
  - id: lint
    avaliador: codigo
    como: "node tools/lint-design-md.mjs DESIGN.md → 0 erros"
  - id: fidelidade
    avaliador: humano
    como: "amostra de 5 telas/arquivos não contradiz os tokens e componentes do arquivo"
  - id: contraste-essencial
    avaliador: codigo
    como: "pares on-* e text-* sobre canvas/surface dentro do mínimo (já coberto pelo lint)"
  - id: conectado-ao-agente
    avaliador: codigo
    como: "CLAUDE.md, AGENTS.md ou regra da ferramenta referencia DESIGN.md"
  - id: sem-conflito
    avaliador: juiz
    como: "nenhuma regra de ferramenta (.cursor/rules, copilot-instructions) contradiz o DESIGN.md"

criterios:
  - { id: fidelidade-a-fonte,     peso: 15, avaliador: humano }
  - { id: validade-tecnica,       peso: 10, avaliador: codigo }
  - { id: tokens-semanticos,      peso: 10, avaliador: juiz }
  - { id: intencao-e-prosa,       peso: 15, avaliador: juiz }
  - { id: componentes-e-estados,  peso: 15, avaliador: juiz }
  - { id: acessibilidade,         peso: 15, avaliador: juiz }
  - { id: responsividade,         peso: 8,  avaliador: juiz }
  - { id: guardrails,             peso: 5,  avaliador: juiz }
  - { id: operacao-com-agente,    peso: 4,  avaliador: codigo }
  - { id: manutencao,             peso: 3,  avaliador: codigo }

ancoras_genericas:
  # Aplique a cada critério e multiplique pela fração do peso.
  0.0: "Ausente ou contraditório."
  0.33: "Presente, mas genérico: o agente ainda precisaria adivinhar decisões centrais."
  0.67: "Específico na maior parte; lacunas pontuais."
  1.0: "Específico, verificável e com exemplos; a geração controlada não revela invenções neste critério."

teste_de_aceitacao:
  descricao: "Geração controlada: peça uma tela nova usando só o DESIGN.md e o código; cada valor/estado/componente inventado é uma lacuna."
  tentativas: 3
